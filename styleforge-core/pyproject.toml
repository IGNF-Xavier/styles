[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "styleforge-core"
version = "0.1.0"
description = "Lecture de styles QGIS (.qml) et écriture SLD 1.0.0 / Mapbox GL Style, sans dépendance QGIS au runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xavier Thauvin" }]
keywords = ["qgis", "sld", "geoserver", "mapbox", "cartography", "geostyler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/IGNF-Xavier/styles"
Repository = "https://github.com/IGNF-Xavier/styles"
Changelog = "https://github.com/IGNF-Xavier/styles/blob/main/styleforge-core/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["styleforge_core"]

[tool.hatch.build.targets.sdist]
exclude = ["tests", "*.qml"]
