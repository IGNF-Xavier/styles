[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "styleforge-api"
version = "0.1.0"
description = "Service HTTP (synchrone et asynchrone) de conversion de styles cartographiques, construit sur styleforge-core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xavier Thauvin" }]
dependencies = [
    "styleforge-core>=0.1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "rq>=1.16",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.27", "fakeredis>=2.20"]

[project.scripts]
styleforge-api-worker = "styleforge_api.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["styleforge_api"]
